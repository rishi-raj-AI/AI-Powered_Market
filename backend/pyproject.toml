[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gaonone-backend"
version = "0.5.0"
description = "Backend API for the GaonOne rural commerce platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.16,<2.0",
  "redis>=6.0,<7.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28,<1.0",
  "firebase-admin>=7.0,<8.0",
  # Business hours are decided in Asia/Kolkata. python:3.x-slim images do not
  # ship the system tz database, so zoneinfo needs this to resolve the zone.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberately narrow: rules that catch real defects (undefined names, unused
# imports, broken f-strings, syntax errors), not style. The codebase uses a
# dense one-line style on purpose, and B008 is FastAPI's own Depends() idiom,
# so enabling those would mean reformatting mature working code to satisfy a
# linter rather than fixing anything.
select = ["E4", "E9", "F"]
