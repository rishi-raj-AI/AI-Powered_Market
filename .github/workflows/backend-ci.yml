name: Backend CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gaonone_ci
          POSTGRES_USER: gaonone
          POSTGRES_PASSWORD: gaonone_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaonone -d gaonone_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://gaonone:gaonone_ci_password@localhost:5432/gaonone_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Install backend without re-resolving
        run: pip install --no-deps -e .

      - name: Verify the dependency lock covers every declared dependency
        run: python ../scripts/check_dependency_lock.py

      - name: Lint
        run: ruff check app tests

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migration head
        run: alembic current

      - name: Verify a single migration head
        run: |
          heads="$(alembic heads | grep -c '(head)')"
          if [ "$heads" != "1" ]; then
            echo "Expected exactly one migration head, found $heads" >&2
            alembic heads >&2
            exit 1
          fi

      # Note: `alembic check` is deliberately not run here. Against this schema
      # it reports PostGIS's own spatial_ref_sys table, the GIST indexes created
      # in raw SQL (invisible to model metadata) and unique-constraint
      # reflection artifacts as drift. Tuning it until it passes would mean
      # filtering exactly the kind of difference it exists to catch, so a check
      # that must be silenced is worse than none. Tracked as deferred work in
      # docs/production-readiness.md.

      - name: Seed development data
        run: python -m app.scripts.seed_dev

      - name: Run backend tests
        run: pytest -q
