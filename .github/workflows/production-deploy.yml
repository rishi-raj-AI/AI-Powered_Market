name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to deploy (defaults to current main)
        required: false
        type: string

concurrency:
  group: gaonone-production
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  DEPLOY_SHA: ${{ inputs.ref || github.sha }}

jobs:
  verify-green-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Wait for current main to pass every release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$DEPLOY_SHA"
          if [[ -z "$SHA" ]]; then
            SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          fi
          MAIN_SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [[ "$SHA" != "$MAIN_SHA" ]]; then
            echo "Candidate $SHA is not current main $MAIN_SHA" >&2
            exit 1
          fi

          required=(backend-check build-and-ui analyze-and-build-android production-compose-and-images)
          deadline=$((SECONDS + 780))
          while (( SECONDS < deadline )); do
            checks="$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | [.name,.status,(.conclusion // "")] | @tsv')"
            failed=0
            pending=0
            for name in "${required[@]}"; do
              line="$(printf '%s\n' "$checks" | awk -F '\t' -v n="$name" '$1==n {print; exit}')"
              status="$(cut -f2 <<<"$line")"
              conclusion="$(cut -f3 <<<"$line")"
              if [[ -z "$line" || "$status" != "completed" ]]; then
                pending=1
              elif [[ "$conclusion" != "success" ]]; then
                echo "Release gate failed: $name ($conclusion)" >&2
                failed=1
              fi
            done
            (( failed == 0 )) || exit 1
            if (( pending == 0 )); then
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              echo "All release gates passed for $SHA"
              exit 0
            fi
            echo "Waiting for release gates for $SHA..."
            sleep 20
          done
          echo "Timed out waiting for release gates for $SHA" >&2
          exit 1

  deploy:
    needs: verify-green-main
    runs-on: [self-hosted, linux, gaonone-production]
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Deploy audited green commit
        env:
          GAONONE_EXPECTED_SHA: ${{ needs.verify-green-main.outputs.sha }}
        run: sudo /home/ubuntu/gaonone/deploy/release.sh
