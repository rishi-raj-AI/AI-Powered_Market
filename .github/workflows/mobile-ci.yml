name: Mobile CI
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  analyze-and-build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze lib
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build apk --debug --dart-define=API_URL=http://10.0.2.2:8000/api/v1
