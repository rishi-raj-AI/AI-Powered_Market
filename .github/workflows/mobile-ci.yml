name: Mobile CI
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android-qa:
    uses: ./.github/workflows/android-qa-build.yml
    # Public repository VARIABLES use the reusable secret channel solely so
    # GitHub masks their values before printing step environment headers.
    # Do not inherit repository secrets or pass release/Admin credentials.
    secrets:
      GAONONE_GOOGLE_MAPS_ANDROID_API_KEY: ${{ vars.GAONONE_GOOGLE_MAPS_ANDROID_API_KEY }}
      GAONONE_FIREBASE_ANDROID_API_KEY: ${{ vars.GAONONE_FIREBASE_ANDROID_API_KEY }}
      GAONONE_FIREBASE_ANDROID_APP_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_APP_ID }}
      GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID }}
      GAONONE_FIREBASE_ANDROID_PROJECT_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_PROJECT_ID }}
      GAONONE_GOOGLE_SERVER_CLIENT_ID: ${{ vars.GAONONE_GOOGLE_SERVER_CLIENT_ID }}

  # Preserve the existing required check name. Failure/skipping/cancellation of
  # any build, analysis, test, signature or artifact step cannot pass this gate.
  analyze-and-build-android:
    needs: android-qa
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Android validation and artifact publication
        env:
          ANDROID_QA_RESULT: ${{ needs.android-qa.result }}
        run: |
          if [ "$ANDROID_QA_RESULT" != success ]; then
            echo "::error::Android QA validation/build did not succeed ($ANDROID_QA_RESULT). See android-qa / build for the exact failure."
            exit 1
          fi
