name: GaonOne QA APK
on:
  push:
    branches:
      - feat/mobile-merchant-products-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Firebase build configuration
        env:
          FIREBASE_API_KEY: ${{ vars.GAONONE_FIREBASE_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_PROJECT_ID }}
        run: |
          for key in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_SENDER_ID FIREBASE_PROJECT_ID; do
            if [ -z "${!key}" ]; then echo "::error::Missing repository variable for $key"; exit 1; fi
          done
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze lib
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Restore permanent Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GAONONE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing GAONONE_ANDROID_KEYSTORE_BASE64"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/gaonone-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gaonone-signing/gaonone-release.jks"
          chmod 600 "$RUNNER_TEMP/gaonone-signing/gaonone-release.jks"
          echo "GAONONE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gaonone-signing/gaonone-release.jks" >> "$GITHUB_ENV"
      - name: Build production-connected signed release QA APK
        working-directory: mobile
        env:
          FIREBASE_API_KEY: ${{ vars.GAONONE_FIREBASE_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_PROJECT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GAONONE_GOOGLE_SERVER_CLIENT_ID }}
          MAPS_ANDROID_API_KEY: ${{ vars.GAONONE_GOOGLE_MAPS_ANDROID_API_KEY }}
          GAONONE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GAONONE_ANDROID_KEYSTORE_PASSWORD }}
          GAONONE_ANDROID_KEY_ALIAS: ${{ secrets.GAONONE_ANDROID_KEY_ALIAS }}
          GAONONE_ANDROID_KEY_PASSWORD: ${{ secrets.GAONONE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in GAONONE_ANDROID_KEYSTORE_PASSWORD GAONONE_ANDROID_KEY_ALIAS GAONONE_ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Missing signing secret $key"; exit 1; fi
          done
          flutter build apk --release --build-number=3 \
            --dart-define=API_URL=https://gaonone.in/api/v1 \
            --dart-define=GAONONE_LEGACY_OTP_ENABLED=false \
            --dart-define=GAONONE_FIREBASE_ANDROID_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=GAONONE_FIREBASE_ANDROID_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=GAONONE_FIREBASE_ANDROID_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GAONONE_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=GAONONE_GOOGLE_MAPS_ANDROID_API_KEY="$MAPS_ANDROID_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/gaonone-qa.apk
      - name: Report new APK signing fingerprints
        run: |
          APK=mobile/build/app/outputs/flutter-apk/gaonone-qa.apk
          set -euo pipefail
          SIGNER_TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$SIGNER_TOOL" verify --print-certs "$APK"
          # apksigner labels certificates as "V2 Signer" on recent Android build-tools.
          # Accept both legacy and versioned labels, but reject ambiguous fingerprints.
          ACTUAL_SHA256=$("$SIGNER_TOOL" verify --print-certs "$APK" | sed -nE 's/^(V[0-9]+ Signer|Signer #[0-9]+):? certificate SHA-256 digest: ([[:xdigit:]]{64})$/\\2/p' | tr '[:upper:]' '[:lower:]' | sort -u)
          if ! [[ "$ACTUAL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not extract exactly one APK signing certificate SHA-256 digest"
            exit 1
          fi
          EXPECTED_SHA256="0b936a93cc249dd83131d92d23011158e7d17536724155ca312059c58f8e935b"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signing certificate does not match the permanent GaonOne certificate"
            exit 1
          fi
      - name: Publish QA APK
        uses: actions/upload-artifact@v4
        with:
          name: gaonone-qa-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/gaonone-qa.apk
          retention-days: 14
          if-no-files-found: error
