name: GaonOne QA APK
on:
  push:
    branches:
      - feat/mobile-merchant-products-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Firebase build configuration
        env:
          FIREBASE_API_KEY: ${{ vars.GAONONE_FIREBASE_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_PROJECT_ID }}
        run: |
          for key in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_SENDER_ID FIREBASE_PROJECT_ID; do
            if [ -z "${!key}" ]; then echo "::error::Missing repository variable for $key"; exit 1; fi
          done
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze lib
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build production-connected debug QA APK
        working-directory: mobile
        env:
          FIREBASE_API_KEY: ${{ vars.GAONONE_FIREBASE_ANDROID_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.GAONONE_FIREBASE_ANDROID_PROJECT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GAONONE_GOOGLE_SERVER_CLIENT_ID }}
          MAPS_ANDROID_API_KEY: ${{ vars.GAONONE_GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=API_URL=https://gaonone.in/api/v1 \
            --dart-define=GAONONE_LEGACY_OTP_ENABLED=false \
            --dart-define=GAONONE_FIREBASE_ANDROID_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=GAONONE_FIREBASE_ANDROID_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=GAONONE_FIREBASE_ANDROID_MESSAGING_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=GAONONE_FIREBASE_ANDROID_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GAONONE_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=GAONONE_GOOGLE_MAPS_ANDROID_API_KEY="$MAPS_ANDROID_API_KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/gaonone-qa.apk
      - name: Report new APK signing fingerprints
        run: |
          APK=mobile/build/app/outputs/flutter-apk/gaonone-qa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" || {
            find "$ANDROID_HOME/build-tools" -name apksigner -type f -exec {} verify --print-certs "$APK" \; -quit
          }
      - name: Publish QA APK
        uses: actions/upload-artifact@v4
        with:
          name: gaonone-qa-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/gaonone-qa.apk
          retention-days: 14
          if-no-files-found: error
